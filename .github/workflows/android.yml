name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      # Адрес сервера можно «зашить» в APK через переменную репозитория API_URL
      # (Settings → Secrets and variables → Actions → Variables). Иначе он вводится в настройках приложения.
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk buhgalteria.apk
      - uses: actions/upload-artifact@v4
        with:
          name: buhgalteria-apk
          path: frontend/buhgalteria.apk
      - name: Публикация в Releases (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/buhgalteria.apk
