name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    # APK пересобирается, только когда меняется само приложение.
    paths:
      - "frontend/**"
      - "!frontend/public/download/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # По умолчанию экшен ставит пакет «tools», которого нет в новых cmdline-tools.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - run: npm ci
      # Адрес сервера «зашивается» в APK, чтобы после установки ничего не настраивать.
      # Другой адрес можно задать переменной репозитория API_URL
      # (Settings → Secrets and variables → Actions → Variables).
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://buhgalteria-lime.vercel.app' }}
      # Предыдущий APK для скачивания с сайта не должен попасть внутрь нового.
      - run: rm -rf dist/download
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk buhgalteria.apk
      - uses: actions/upload-artifact@v4
        with:
          name: buhgalteria-apk
          path: frontend/buhgalteria.apk
      - name: Выложить APK на сайт (только main)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/download
          cp buhgalteria.apk public/download/buhgalteria.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/download/buhgalteria.apk
          git commit -m "APK для скачивания с сайта (сборка ${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Публикация в Releases (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/buhgalteria.apk
